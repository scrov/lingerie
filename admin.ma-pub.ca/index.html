$("#form_admin_dev").on('click', '#btn_admin_dev', function(){
  $('#btn_admin_dev').html("<i class='fa fa-spinner fa-pulse'></i> Saving...");

    action = "action_admin_dev"; // add or edit
    admin_dev = document.getElementById('admin_dev').checked;

    var formData = {action:action, admin_dev:admin_dev, submit:true};
    $.ajax({ 
        url : "//admin.ma-pub.ca/ajax-admin-member.php", 
        type: "POST", 
        data : formData,
        success: function(e) {
            setTimeout(function() { $('#btn_admin_dev').html("<i class='fa fa-check'></i> Saved!");
            setTimeout(function() { $('#btn_admin_dev').html("<i class='fa fa-floppy-o'></i>"); }, 1000); }, 1000);
      		window.location.href="//admin.ma-pub.ca/home/";
        },
        error: function() {
            setTimeout(function() { $('#btn_admin_dev').html("<i class='fa fa-exclamation-triangle'></i> Error!");
            setTimeout(function() { $('#btn_admin_dev').html("<i class='fa fa-floppy-o'></i>"); }, 1000); }, 1000);
            window.location.href="//admin.ma-pub.ca/home/";
        }
    });
});
