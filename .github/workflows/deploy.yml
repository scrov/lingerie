# Builds and tests both apps on every push and pull request, then deploys to Cloudflare:
#
#   apps/cms  → Worker "lingerie-cms" (D1 migrations first)            https://lingerie-cms.scrov.app
#   apps/web  → Worker "lingerie" + the Angular SSR server as a Container  https://lingerie.scrov.app
#
# Deploys run on pushes to main and scrov-patch-1, or manually from the Actions tab (Run workflow).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   required. Account: Workers Scripts Edit, Containers Edit, D1 Edit, Workers R2 Storage Edit,
#                          Account Settings Read; Zone (scrov.app): Workers Routes Edit. See README.md › Deploy.
#   CLOUDFLARE_ACCOUNT_ID  required.
#   CMS_ADMIN_TOKEN        optional. When set, every deploy writes it to the CMS as ADMIN_TOKEN (the admin password).

name: CI and deploy

on:
  push:
    branches: [main, scrov-patch-1]
    paths-ignore: ['**/*.md', 'legacy/**']
  pull_request:
    paths-ignore: ['**/*.md', 'legacy/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  NG_CLI_ANALYTICS: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  cms:
    name: CMS · typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Validate Worker bundle and config
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cms-dry-run"

  web:
    name: Storefront · build, test, container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:worker
      - run: npx ng test --watch=false
      - run: npx ng build

      - name: Build container image
        run: docker build --platform linux/amd64 -t lingerie-storefront:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name storefront -p 8080:8080 lingerie-storefront:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "::error::Container did not answer /healthz within 30 s"; exit 1; }
            sleep 1
          done

          fail=0
          expect() { # expect <description> <actual> <wanted>
            if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "::error::$1: got '$2', wanted '$3'"; fail=1; fi
          }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          location() { curl -s -o /dev/null -w '%{redirect_url}' "$@"; }

          expect "GET /healthz" "$(curl -s http://localhost:8080/healthz)" "ok"
          expect "GET / status" "$(status http://localhost:8080/)" "200"
          if curl -s http://localhost:8080/ | grep -q 'ng-server-context="ssr"'; then
            echo "ok   GET / is server-rendered"
          else
            echo "::error::GET / was not server-rendered"; fail=1
          fi
          # What the front Worker sends: Host "container" plus the public host in X-Forwarded-Host.
          if curl -s -H 'Host: container' -H 'X-Forwarded-Host: lingerie.scrov.app' -H 'X-Forwarded-Proto: https' \
              http://localhost:8080/ | grep -q 'ng-server-context="ssr"'; then
            echo "ok   GET / through the Worker's headers is server-rendered"
          else
            echo "::error::GET / with the Worker's forwarding headers was not server-rendered"; fail=1
          fi
          expect "old URL redirects" "$(status http://localhost:8080/blog.html)" "301"
          expect "redirect uses the forwarded host" \
            "$(location -H 'X-Forwarded-Host: lingerie.scrov.app' -H 'X-Forwarded-Proto: https' http://localhost:8080/index.html)" \
            "https://lingerie.scrov.app/"
          expect "unknown hosts fall back to the public origin" \
            "$(location -H 'Host: attacker.example' http://localhost:8080/blog.html)" \
            "https://lingerie.scrov.app/blog"
          exit $fail

      - name: Container logs
        if: always()
        run: docker logs storefront 2>&1 | tail -n 100 || true

      - name: Validate Worker bundle and config
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dry-run"

      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: [cms, web]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/scrov-patch-1'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One production deploy at a time, never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (Settings → Secrets and variables → Actions), then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ---- CMS ----
      - name: Install CMS tooling
        working-directory: apps/cms
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        working-directory: apps/cms
        run: npx wrangler d1 migrations apply lingerie-cms --remote

      - name: Deploy CMS Worker
        working-directory: apps/cms
        run: npx wrangler deploy --message "${GITHUB_SHA::7} via GitHub Actions"

      - name: Set CMS admin password
        working-directory: apps/cms
        env:
          ADMIN_TOKEN: ${{ secrets.CMS_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "CMS_ADMIN_TOKEN is not set; leaving the CMS ADMIN_TOKEN secret as it is."
            exit 0
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      # ---- Storefront: Worker + container ----
      - name: Install storefront tooling
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

      # Builds the image from apps/web/Dockerfile, pushes it to Cloudflare's registry and replaces the running container.
      - name: Deploy storefront Worker and container
        working-directory: apps/web
        run: npx wrangler deploy --containers-rollout=immediate --message "${GITHUB_SHA::7} via GitHub Actions"

      # The first deploy can take a few minutes while Cloudflare provisions the container.
      - name: Check the live site
        run: |
          wait_for() { # wait_for <url> <text the body must contain>
            deadline=$(( $(date +%s) + 600 ))
            while :; do
              body=$(curl -s --max-time 60 -w '\n%{http_code}' "$1") || true
              code=${body##*$'\n'}
              if [ "$code" = 200 ] && grep -qF -- "$2" <<<"${body%$'\n'*}"; then echo "ok   $1"; return 0; fi
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "::error::$1 answered $code"; return 1; fi
              echo "…    $1 answered $code, retrying"
              sleep 15
            done
          }
          wait_for https://lingerie-cms.scrov.app/api/settings '{'
          wait_for https://lingerie.scrov.app/healthz 'ok'
          wait_for https://lingerie.scrov.app/ 'ng-server-context="ssr"'

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo "- Storefront: https://lingerie.scrov.app"
            echo "- CMS admin: https://lingerie-cms.scrov.app/admin/"
          } >> "$GITHUB_STEP_SUMMARY"
