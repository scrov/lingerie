# Builds and tests both apps on every push and pull request (type checks, unit tests, container smoke test).
#
# Optional deploy job, for when Cloudflare Workers Builds is NOT deploying these Workers (see README.md › Deploy):
#   apps/cms  → Worker "lingerie-cms" (D1 migrations first)            https://lingerie-cms.scrov.app
#   apps/web  → Worker "lingerie" + the Angular SSR server as a Container  https://lingerie.scrov.app
# It runs on pushes to prod, or manually (Actions → Run workflow), and only when these repository
# secrets exist (Settings → Secrets and variables → Actions); without them it is skipped:
#   CLOUDFLARE_API_TOKEN   Account: Workers Scripts Edit, Containers Edit, D1 Edit, Workers R2 Storage Edit,
#                          Account Settings Read; Zone (scrov.app): Workers Routes Edit.
#   CLOUDFLARE_ACCOUNT_ID
#   CMS_ADMIN_TOKEN        optional. When set, every deploy writes it to the CMS as ADMIN_TOKEN (the admin password).

name: CI and deploy

on:
  push:
    branches: [prod]
    paths-ignore: ['**/*.md', 'legacy/**']
  pull_request:
    paths-ignore: ['**/*.md', 'legacy/**']
  workflow_dispatch:
    inputs:
      print_screenshots:
        description: Also print the storefront screenshots into the log (base64)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  NG_CLI_ANALYTICS: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  cms:
    name: CMS · typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Validate Worker bundle and config
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/cms-dry-run"

  web:
    name: Storefront · build, test, container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:worker
      - run: npx ng test --watch=false
      - run: npx ng build

      - name: Build container image
        run: docker build --platform linux/amd64 -t lingerie-storefront:ci .

      # The real CMS Worker, run locally (wrangler dev) with the imported content, so the container renders real pages.
      - name: Start a local CMS
        working-directory: apps/cms
        run: |
          npm install --no-audit --no-fund
          npx wrangler d1 migrations apply lingerie-cms --local
          npx wrangler d1 execute lingerie-cms --local --file seed/legacy-content.sql > /dev/null
          npx wrangler d1 execute lingerie-cms --local --file seed/product-pages.sql > /dev/null
          nohup npx wrangler dev --port 8787 --ip 0.0.0.0 --var "ADMIN_TOKEN:$CMS_ADMIN_TOKEN" > "$RUNNER_TEMP/cms.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8787/api/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/cms.log"
          echo "::error::The local CMS did not start"
          exit 1
        env:
          CMS_ADMIN_TOKEN: ci-admin-token-0123456789abcdef

      - name: Smoke test the container
        run: |
          docker run -d --name storefront -p 8080:8080 --add-host=host.docker.internal:host-gateway \
            -e CMS_INTERNAL_URL=http://host.docker.internal:8787 lingerie-storefront:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            [ "$i" = 30 ] && { echo "::error::Container did not answer /healthz within 30 s"; exit 1; }
            sleep 1
          done

          fail=0
          expect() { # expect <description> <actual> <wanted>
            if [ "$2" = "$3" ]; then echo "ok   $1"; else echo "::error::$1: got '$2', wanted '$3'"; fail=1; fi
          }
          status() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          location() { curl -s -o /dev/null -w '%{redirect_url}' "$@"; }

          expect "GET /healthz" "$(curl -s http://localhost:8080/healthz)" "ok"
          expect "GET / status" "$(status http://localhost:8080/)" "200"
          if curl -s http://localhost:8080/ | grep -q 'ng-server-context="ssr"'; then
            echo "ok   GET / is server-rendered"
          else
            echo "::error::GET / was not server-rendered"; fail=1
          fi
          # What the front Worker sends: Host "container" plus the public host in X-Forwarded-Host.
          if curl -s -H 'Host: container' -H 'X-Forwarded-Host: lingerie.scrov.app' -H 'X-Forwarded-Proto: https' \
              http://localhost:8080/ | grep -q 'ng-server-context="ssr"'; then
            echo "ok   GET / through the Worker's headers is server-rendered"
          else
            echo "::error::GET / with the Worker's forwarding headers was not server-rendered"; fail=1
          fi
          if curl -s http://localhost:8080/ | grep -q 'menu-produits'; then
            echo "ok   GET / has the Produits menu (content from the CMS)"
          else
            echo "::error::GET / has no Produits menu: the server could not read the CMS"; fail=1
          fi
          if curl -s http://localhost:8080/cms/api/settings | grep -q '"site_name"'; then
            echo "ok   /cms/api/settings proxies the CMS"
          else
            echo "::error::/cms/api/settings does not reach the CMS"; fail=1
          fi
          expect "the CMS admin API is not proxied" "$(status http://localhost:8080/cms/api/admin/settings)" "404"
          expect "old URL redirects" "$(status http://localhost:8080/blog.html)" "301"
          expect "redirect uses the forwarded host" \
            "$(location -H 'X-Forwarded-Host: lingerie.scrov.app' -H 'X-Forwarded-Proto: https' http://localhost:8080/index.html)" \
            "https://lingerie.scrov.app/"
          expect "unknown hosts fall back to the public origin" \
            "$(location -H 'Host: attacker.example' http://localhost:8080/blog.html)" \
            "https://lingerie.scrov.app/blog"
          exit $fail

      - name: Screenshots
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1
          node "$GITHUB_WORKSPACE/.github/scripts/screenshots.mjs"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright-core/index.mjs
          PRINT_SCREENSHOTS: ${{ inputs.print_screenshots && '1' || '0' }}
          CMS_ADMIN_TOKEN: ci-admin-token-0123456789abcdef

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: apps/web/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Container and CMS logs
        if: always()
        run: |
          docker logs storefront 2>&1 | tail -n 60 || true
          tail -n 40 "$RUNNER_TEMP/cms.log" 2>/dev/null || true

      - name: Validate Worker bundle and config
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/web-dry-run"

      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3
          if-no-files-found: error

  credentials:
    name: Check deploy credentials
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets, so this workflow does not deploy. Cloudflare Workers Builds deploys instead (README.md › Deploy)."
          fi

  deploy:
    name: Deploy to Cloudflare
    needs: [cms, web, credentials]
    if: needs.credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One production deploy at a time, never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ---- CMS ----
      - name: Install CMS tooling
        working-directory: apps/cms
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        working-directory: apps/cms
        run: npx wrangler d1 migrations apply lingerie-cms --remote

      - name: Deploy CMS Worker
        working-directory: apps/cms
        run: npx wrangler deploy --message "${GITHUB_SHA::7} via GitHub Actions"

      - name: Set CMS admin password
        working-directory: apps/cms
        env:
          ADMIN_TOKEN: ${{ secrets.CMS_ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "CMS_ADMIN_TOKEN is not set; leaving the CMS ADMIN_TOKEN secret as it is."
            exit 0
          fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      # ---- Storefront: Worker + container ----
      - name: Install storefront tooling
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

      # Builds the image from apps/web/Dockerfile, pushes it to Cloudflare's registry and replaces the running container.
      - name: Deploy storefront Worker and container
        working-directory: apps/web
        run: npx wrangler deploy --containers-rollout=immediate --message "${GITHUB_SHA::7} via GitHub Actions"

      # The first deploy can take a few minutes while Cloudflare provisions the container.
      - name: Check the live site
        run: |
          wait_for() { # wait_for <url> <text the body must contain>
            deadline=$(( $(date +%s) + 600 ))
            while :; do
              body=$(curl -s --max-time 60 -w '\n%{http_code}' "$1") || true
              code=${body##*$'\n'}
              if [ "$code" = 200 ] && grep -qF -- "$2" <<<"${body%$'\n'*}"; then echo "ok   $1"; return 0; fi
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "::error::$1 answered $code"; return 1; fi
              echo "…    $1 answered $code, retrying"
              sleep 15
            done
          }
          wait_for https://lingerie-cms.scrov.app/api/settings '{'
          wait_for https://lingerie.scrov.app/healthz 'ok'
          wait_for https://lingerie.scrov.app/ 'ng-server-context="ssr"'

      - name: Summary
        if: success()
        run: |
          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo "- Storefront: https://lingerie.scrov.app"
            echo "- CMS admin: https://lingerie-cms.scrov.app/admin/"
          } >> "$GITHUB_STEP_SUMMARY"
