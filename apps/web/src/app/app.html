@let s = settings();
<a class="skip" href="#contenu">Aller au contenu</a>

@if (s.announcement) {
  <div class="bg-primary px-4 py-2.5 text-center text-sm font-medium text-primary-foreground">{{ s.announcement }}</div>
}

<app-site-header [settings]="s" [pages]="pages()" />

<main id="contenu" tabindex="-1">
  <router-outlet />
</main>

<app-site-footer [settings]="s" [pages]="pages()" />
<app-cookie-banner [settings]="s" [pages]="pages()" />
